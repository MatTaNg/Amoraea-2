<!DOCTYPE html>
<html>
  <body style="font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1a1a1a;">
    <h2 style="font-size: 20px; margin-bottom: 8px;">Reset your Amoraea password</h2>
    <p style="margin-bottom: 16px;">
      We received a request to reset the password for your account. Click the button below to choose a new password.
    </p>
    <p style="margin-bottom: 24px;">
      <a
        href="{{ .SiteURL }}/auth/reset-password?token_hash={{ .TokenHash }}&type=recovery"
        style="display: inline-block; background: #5BA8E8; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600;"
      >
        Reset password
      </a>
    </p>
    <p style="font-size: 14px; color: #555;">
      Or enter this code on the reset page: <strong>{{ .Token }}</strong>
    </p>
    <p style="font-size: 13px; color: #777; margin-top: 24px;">
      If you did not request a password reset, you can ignore this email.
    </p>
  </body>
</html>
